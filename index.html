<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dry? Is it a dry day where you are</title>
  <meta name="description" content="Open it and know if liquor shops in your state are shut today.">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dry?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <section class="stage">
    <div class="liquid" aria-hidden="true">
      <svg class="wave w1" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 V60 H0Z"/></svg>
      <svg class="wave w2" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q150 60 300 30 T600 30 T900 30 T1200 30 V60 H0Z"/></svg>
      <div class="body"></div>
      <span class="bub" style="--x:12%;--d:6s;--s:6px"></span>
      <span class="bub" style="--x:28%;--d:8s;--s:4px;--o:2s"></span>
      <span class="bub" style="--x:46%;--d:5.5s;--s:7px;--o:1s"></span>
      <span class="bub" style="--x:63%;--d:7s;--s:5px;--o:3s"></span>
      <span class="bub" style="--x:79%;--d:6.5s;--s:4px;--o:.5s"></span>
      <span class="bub" style="--x:91%;--d:9s;--s:6px;--o:2.5s"></span>
    </div>

    <div class="shell stage-in">
      <header class="bar">
        <a class="mark" href="./">dry<span>?</span></a>
        <button class="btn-ghost" id="where" aria-label="Change state">
          <i class="ph ph-map-pin"></i><span id="whereName">Finding you</span><i class="ph ph-caret-down"></i>
        </button>
      </header>

      <div class="hero">
        <p class="ask" id="date">Is today a dry day in</p>
        <h1 class="state" id="state"><span class="skeleton sm"></span></h1>
        <div class="answer-wrap"><span class="answer" id="answer"><span class="skeleton"></span></span></div>
        <p class="reason" id="reason"></p>
      </div>
    </div>
  </section>

  <div class="ticker" aria-hidden="true"><div class="track" id="ticker"></div></div>

  <div class="shell">
    <main class="grid">
      <div class="col">
        <div class="next" id="next"></div>

        <section class="cal">
          <div class="cal-head"><h2>Next three weeks</h2><span id="range"></span></div>
          <div class="weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
          <div class="days" id="days"></div>
        </section>
      </div>

      <div class="col">
        <section class="up">
          <h2>Coming up</h2>
          <div id="ahead"></div>
        </section>

        <a class="install" href="install.html">
          <span><strong>Add to home screen</strong><p>One tap opens the state you're in.</p></span>
          <span class="go-ico"><i class="ph ph-arrow-right"></i></span>
        </a>

        <p class="foot">Checked <span id="verified"></span>. We only list dates backed by a state order. District, election and protest closures can be announced at short notice.</p>
      </div>
    </main>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="panel-sheet">
      <div class="sheet-top">
        <h3 id="sheetTitle">Choose your state</h3>
        <button class="icon-btn" id="close" aria-label="Close"><i class="ph ph-x"></i></button>
      </div>
      <button class="btn-solid" id="useLoc"><i class="ph ph-crosshair"></i>Use my location</button>
      <p class="msg" id="msg"></p>
      <div class="field">
        <label for="search">Or search</label>
        <input id="search" placeholder="Maharashtra, Delhi, Goa" autocomplete="off">
      </div>
      <div class="opts" id="opts"></div>
    </div>
  </div>

  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
